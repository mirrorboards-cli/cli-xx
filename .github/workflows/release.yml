name: Release

# Builds a release of xx, an archive for each system it runs on, and puts them in a draft GitHub
# release. `xx release publish <TAG>` starts it, or finds the draft it made; it signs every
# archive, uploads the .sig files and publishes the release. With draft set to false the run only
# builds: the archives stay the run's artifacts, to look at before a release.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "The release's tag, e.g. v0.2.0; cli-xx/Cargo.toml must carry the same version"
        required: true
      draft:
        description: "Draft the release; false keeps the archives as the run's artifacts only"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  sources:
    name: Sources at their pinned commits
    runs-on: ubuntu-latest
    steps:
      - name: Checkout cli-xx
        uses: actions/checkout@v4
        with:
          path: cli-xx

      - name: Setup SSH key file for mctl
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.MCTL_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keygen -y -f ~/.ssh/id_ed25519 > ~/.ssh/id_ed25519.pub
          ssh-keyscan github.com >> ~/.ssh/known_hosts

      - name: Install mctl
        # Prebuilt static binary from the mirrorboards-mctl dist branch, over the same SSH key.
        run: |
          git clone --depth 1 --branch dist git@github.com:mirrorboards-cli/mirrorboards-mctl.git /tmp/mctl-dist
          (cd /tmp/mctl-dist && sha256sum -c mctl-linux-amd64.sha256)
          sudo install -m 0755 /tmp/mctl-dist/mctl-linux-amd64 /usr/local/bin/mctl

      - name: Sync the pinned dependencies with mctl
        working-directory: cli-xx/.github-ci
        run: mctl sync

      - name: Lay out the workspace
        # cli-xx reaches its dependencies by path, as in the workspace: put it beside them. mctl
        # lays them out under their top directories (mirrorboards-core, vendors), so every
        # directory it made moves.
        run: |
          mkdir -p workspace
          for synced in cli-xx/.github-ci/*/; do
            mv "$synced" workspace/
          done
          cp cli-xx/.github-ci/Cargo.toml workspace/Cargo.toml
          mkdir -p workspace/mirrorboards-core/mirrorboards-cli
          rsync -a --exclude .git --exclude .github-ci cli-xx/ workspace/mirrorboards-core/mirrorboards-cli/cli-xx/
          tar -czf workspace.tar.gz -C workspace .

      - uses: actions/upload-artifact@v4
        with:
          name: workspace
          path: workspace.tar.gz
          retention-days: 1

  macos-arm64:
    name: Build for macOS arm64
    needs: sources
    runs-on: macos-15
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: workspace

      - name: Unpack the workspace
        run: mkdir -p workspace && tar -xzf workspace.tar.gz -C workspace

      - name: Check the version
        working-directory: workspace/mirrorboards-core/mirrorboards-cli/cli-xx
        run: |
          crate="v$(grep -m1 '^version' Cargo.toml | cut -d '"' -f 2)"
          if [ "$crate" != "${{ inputs.version }}" ]; then
            echo "Cargo.toml says $crate, the release is ${{ inputs.version }}" >&2
            exit 1
          fi

      - uses: dtolnay/rust-toolchain@stable

      # Pulumi's Rust language host, built beside xx (PT-4 of cli-spec xx.typ).
      - uses: actions/setup-go@v5
        with:
          go-version-file: workspace/vendors/pulumi-labs/pulumi-rust/pulumi-language-rust/go.mod
          cache: false

      - name: Build
        env:
          VERSION: ${{ inputs.version }}
        run: |
          ROOT="$GITHUB_WORKSPACE/workspace" WORK="$GITHUB_WORKSPACE/xx-release" \
            workspace/mirrorboards-core/mirrorboards-cli/cli-xx/scripts/build-release-macos.sh

      - uses: actions/upload-artifact@v4
        with:
          name: xx-macos-arm64
          path: xx-release/${{ inputs.version }}/xx-macos-arm64.tar.gz*
          retention-days: 3

  linux-x64:
    name: Build for Linux x64
    needs: sources
    runs-on: ubuntu-latest
    # Debian bookworm's glibc (2.36), not the runner's newer one: xx then runs on bookworm, as in
    # the deployment image, and on every newer system.
    container: rust:1.99-bookworm
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: workspace

      - name: Unpack the workspace
        run: mkdir -p workspace && tar -xzf workspace.tar.gz -C workspace

      - name: Check the version
        working-directory: workspace/mirrorboards-core/mirrorboards-cli/cli-xx
        run: |
          crate="v$(grep -m1 '^version' Cargo.toml | cut -d '"' -f 2)"
          if [ "$crate" != "${{ inputs.version }}" ]; then
            echo "Cargo.toml says $crate, the release is ${{ inputs.version }}" >&2
            exit 1
          fi

      # Pulumi's Rust language host, built beside xx (PT-4 of cli-spec xx.typ).
      - uses: actions/setup-go@v5
        with:
          go-version-file: workspace/vendors/pulumi-labs/pulumi-rust/pulumi-language-rust/go.mod
          cache: false

      # In a container the expressions name the runner's paths; the shell's variables name the
      # container's.
      - name: Build
        env:
          VERSION: ${{ inputs.version }}
        run: |
          ROOT="$GITHUB_WORKSPACE/workspace" WORK="$GITHUB_WORKSPACE/xx-release" \
            workspace/mirrorboards-core/mirrorboards-cli/cli-xx/scripts/build-release-linux.sh

      - uses: actions/upload-artifact@v4
        with:
          name: xx-linux-x64
          path: xx-release/${{ inputs.version }}/xx-linux-x64.tar.gz*
          retention-days: 3

  draft:
    name: Draft the release
    needs: [macos-arm64, linux-x64]
    if: inputs.draft
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: xx-*
          merge-multiple: true
          path: archives

      - uses: actions/download-artifact@v4
        with:
          name: workspace

      - name: Draft the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          changelog=./mirrorboards-core/mirrorboards-cli/cli-xx/CHANGELOG.md
          tar -xzf workspace.tar.gz "$changelog"
          notes="$RUNNER_TEMP/notes.md"
          awk -v v="${VERSION#v}" '
            $0 ~ "^## \\[" v "\\]" { keep = 1; next }
            keep && /^## \[/ { exit }
            keep && /^\[[^]]+\]: / { exit }
            keep { print }
          ' "$changelog" > "$notes"
          gh release create "$VERSION" --repo "$GITHUB_REPOSITORY" --draft \
            --title "xx ${VERSION#v}" --notes-file "$notes" \
            archives/xx-macos-arm64.tar.gz archives/xx-macos-arm64.tar.gz.sha256 \
            archives/xx-linux-x64.tar.gz archives/xx-linux-x64.tar.gz.sha256
