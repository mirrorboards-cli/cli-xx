[package]
name = "cli-xx"
version = "0.3.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false
description = "xx: the successor of the x command line. Its commands are added one by one as the owner defines them (cli-spec xx.typ); x keeps working beside it on the same core."

# Its own workspace root; the shared core comes in as path dependencies.
[workspace]

[lib]
name = "cli_xx"
path = "src/lib.rs"

[[bin]]
name = "xx"
path = "src/main.rs"

[dependencies]
anyhow = "1"
# The core xx shares with x: networks, contexts, vault sessions, the actor, the output.
cli-runtime = { path = "../cli-runtime" }
clap = { version = "4.5", features = ["derive", "wrap_help"] }
# `xx completion`: Tab completion that asks xx itself, so it knows the vaults and identities here.
clap_complete = { version = "4.6", features = ["unstable-dynamic"] }
tokio = { version = "1", features = ["rt"] }
# `xx vault …`: the XKeys commands of xx live in xkeys-cli's `xx` module, beside x's own.
xkeys-cli = { path = "../../mirrorboards-xkeys/xkeys-cli" }
# `xx stacks …`: the Pulumi platforms, from xstacks' `xx` module.
mirrorboards-xstacks = { path = "../../mirrorboards-dev/dev-cli-xstacks" }
# `xx wallet …`: the methods of Mirrornet's cli_wallet, from mirrornet-cli's `xx` module.
mirrornet-cli = { path = "../../mirrorboards-mirrornet/mirrornet-cli" }
# `xx update`: the newest release of xx on GitHub, its archive and the swap of this program.
self_update = { version = "0.42", default-features = false, features = ["archive-tar", "compression-flate2", "rustls"] }
sha2 = "0.10"
# The header types of the HTTP client self_update downloads with.
reqwest = { version = "0.12", default-features = false }
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# `xx release sign` and the check of `xx update`: compact secp256k1 signatures of the chain SDK.
xkeys-chain = { path = "../../mirrorboards-xkeys/xkeys-chain" }
